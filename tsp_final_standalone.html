<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSP Branch & Bound Visualizer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F3F4F6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .panel {
            background-color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
            width: 90%;
            max-width: 1000px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        button {
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
            color: white;
        }
        button:hover:not(:disabled) { opacity: 0.8; }
        button:disabled { background-color: #9CA3AF !important; cursor: not-allowed; }
        
        .btn-blue { background-color: #3B82F6; }
        .btn-red { background-color: #EF4444; }
        .btn-green { background-color: #10B981; }
        .btn-gray { background-color: #E5E7EB; color: #374151; }

        .info-text { font-size: 14px; color: #374151; flex-grow: 1; font-weight: 500; }
        
        #canvas-container {
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }
        
        .slider-container { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #6B7280; }
        input[type=range] { cursor: pointer; }
    </style>
</head>
<body>

    <!-- Top Control Panel -->
    <div class="panel">
        <button class="btn-blue" id="solveBtn">Solve TSP</button>
        <button class="btn-red" id="clearBtn">Clear Map</button>
        <div class="info-text" id="mainStatus">Click on the map to add cities.</div>
    </div>

    <!-- Map Canvas -->
    <div id="canvas-container">
        <canvas id="mapCanvas"></canvas>
    </div>

    <!-- Bottom Animation Panel -->
    <div class="panel" style="margin-top: 15px;">
        <button class="btn-gray" id="prevBtn" disabled>&lt; Prev</button>
        <button class="btn-green" id="playBtn" disabled>Replay Animation</button>
        <button class="btn-gray" id="nextBtn" disabled>Next &gt;</button>
        
        <div class="slider-container">
            <span>Speed:</span>
            <input type="range" id="speedSlider" min="10" max="800" value="150" dir="rtl">
        </div>
        
        <div class="info-text" id="animStatus" style="text-align: right; font-weight: bold; color: #111827;"></div>
    </div>

        let cities = [];
        let historyData = [];
        let currentFrame = 0;
        let isPlaying = false;
        let isCalculating = false;
        let animTimer = null;

        // UI Elements
        const solveBtn = document.getElementById('solveBtn');
        const clearBtn = document.getElementById('clearBtn');
        const mainStatus = document.getElementById('mainStatus');
        const prevBtn = document.getElementById('prevBtn');
        const playBtn = document.getElementById('playBtn');
        const nextBtn = document.getElementById('nextBtn');
        const speedSlider = document.getElementById('speedSlider');
        const animStatus = document.getElementById('animStatus');

        // Draw Map Image
        mapImg.onload = () => {
            const maxWidth = window.innerWidth * 0.9;
            const maxHeight = window.innerHeight * 0.7;
            const scale = Math.min(maxWidth / mapImg.width, maxHeight / mapImg.height, 1);
            
            canvas.width = mapImg.width * scale;
            canvas.height = mapImg.height * scale;
            redrawBase();
        };

        mapImg.onerror = () => {
            canvas.width = 800; canvas.height = 600;
            ctx.fillStyle = "#E5E7EB"; ctx.fillRect(0, 0, 800, 600);
            ctx.fillStyle = "black"; ctx.font = "20px Arial";
            ctx.fillText("Cannot load europe1.jpg. Place it in the same folder.", 150, 300);
        };

        function redrawBase() {
            if (mapImg.complete && mapImg.naturalWidth !== 0) {
                ctx.drawImage(mapImg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            
            cities.forEach((city, index) => {
                ctx.beginPath();
                ctx.arc(city.x, city.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#EF4444';
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#111827';
                ctx.font = 'bold 12px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText(index, city.x, city.y - 12);
            });
        }

        canvas.addEventListener('click', (e) => {
            if (isCalculating || isPlaying) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            cities.push({x, y});
            
            resetAnimation();
            redrawBase();
            mainStatus.textContent = `Added city. Total: ${cities.length}`;
            mainStatus.style.color = "#374151";
        });

        clearBtn.addEventListener('click', () => {
            if (isCalculating) return;
            cities = [];
            resetAnimation();
            redrawBase();
            mainStatus.textContent = "Map cleared. Click to add cities.";
            mainStatus.style.color = "#374151";
        });

        function resetAnimation() {
            isPlaying = false;
            clearTimeout(animTimer);
            historyData = [];
            playBtn.textContent = "Replay Animation";
            playBtn.disabled = true;
            playBtn.className = "btn-gray";
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            animStatus.textContent = "";
        }

        // ---------------------------------------------------------
        // Core Algorithm (Single Thread Fallback for Local Files)
        // ---------------------------------------------------------
        function branchAndBound(nodes) {
            const n = nodes.length;
            const dist = Array(n).fill(0).map(() => Array(n).fill(0));
            for (let i=0; i<n; i++) {
                for (let j=0; j<n; j++) {
                    dist[i][j] = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
                }
            }

            let bestPath = null;
            let bestCost = Infinity;
            let visitedNodes = 0;
            let prunedBranches = 0;
            let history = [];

            function bnb(currPath, currentCost, visited) {
                visitedNodes++;
                history.push({ path: [...currPath], action: 'explore', currentCost, bestCost });

                if (currPath.length === n) {
                    const finalCost = currentCost + dist[currPath[n-1]][currPath[0]];
                    if (finalCost < bestCost) {
                        bestCost = finalCost;
                        bestPath = [...currPath, currPath[0]];
                        history.push({ path: [...bestPath], action: 'best', currentCost: finalCost, bestCost });
                    }
                    return;
                }

                let lb = currentCost;
                for (let i=0; i<n; i++) {
                    if (!visited[i]) {
                        let minE = Infinity;
                        for (let j=0; j<n; j++) {
                            if (i !== j && (!visited[j] || j === currPath[0])) {
                                minE = Math.min(minE, dist[i][j]);
                            }
                        }
                        if (minE !== Infinity) lb += minE;
                    }
                }

                if (lb >= bestCost) {
                    prunedBranches++;
                    history.push({ path: [...currPath], action: 'prune', currentCost: lb, bestCost });
                    return;
                }

                let lastNode = currPath[currPath.length-1];
                let neighbors = [];
                for (let i=0; i<n; i++) {
                    if (!visited[i]) {
                        neighbors.push({d: dist[lastNode][i], i: i});
                    }
                }
                neighbors.sort((a, b) => a.d - b.d);

                for (let neighbor of neighbors) {
                    let i = neighbor.i;
                    visited[i] = true;
                    currPath.push(i);
                    bnb(currPath, currentCost + neighbor.d, visited);
                    currPath.pop();
                    visited[i] = false;
                }
            }

            let visited = Array(n).fill(false);
            visited[0] = true;
            bnb([0], 0, visited);
            
            if (bestPath) {
                history.push({ path: bestPath, action: 'best', currentCost: bestCost, bestCost: bestCost });
            }

            return { bestPath, bestCost, visitedNodes, prunedBranches, history };
        }

        solveBtn.addEventListener('click', () => {
            if (cities.length < 3) {
                mainStatus.textContent = "Please add at least 3 cities.";
                mainStatus.style.color = "#EF4444";
                return;
            }
            if (isCalculating) return;

            isCalculating = true;
            solveBtn.disabled = true;
            clearBtn.disabled = true;
            solveBtn.textContent = "Calculating...";
            resetAnimation();
            redrawBase();
            
            mainStatus.innerHTML = `Calculating optimal route for ${cities.length} cities...`;
            mainStatus.style.color = "#3B82F6";

            // 使用 setTimeout 释放主线程一次，确保 UI 能够渲染出 "Calculating..." 状态
            setTimeout(() => {
                const startTime = performance.now();
                const res = branchAndBound(cities);
                const runtime = ((performance.now() - startTime) / 1000).toFixed(4);
                
                isCalculating = false;
                solveBtn.disabled = false;
                clearBtn.disabled = false;
                solveBtn.textContent = "Solve TSP";

                if (res.bestPath) {
                    mainStatus.textContent = `✅ Distance: ${res.bestCost.toFixed(1)} px | Runtime: ${runtime}s | Nodes: ${res.visitedNodes} | Pruned: ${res.prunedBranches}`;
                    mainStatus.style.color = "#10B981";
                    
                    historyData = res.history;
                    playBtn.disabled = false;
                    playBtn.className = "btn-green";
                    prevBtn.disabled = false;
                    nextBtn.disabled = false;
                    
                    currentFrame = historyData.length - 1;
                    drawFrame(currentFrame);
                } else {
                    mainStatus.textContent = "Failed to find a path.";
                    mainStatus.style.color = "#EF4444";
                }
            }, 50);
        });

        // ---------------------------------------------------------
        // Animation & Drawing Logic
        // ---------------------------------------------------------
        function drawFrame(idx) {
            redrawBase(); 
            if (!historyData || historyData.length === 0) return;

            const state = historyData[idx];
            const path = state.path;
            
            let lineColor, lineWidth, isDash, statusText, statusColor;

            if (state.action === 'explore') {
                lineColor = "#9CA3AF"; lineWidth = 3; isDash = true;
                statusText = `Exploring... Cost: ${state.currentCost.toFixed(1)}`;
                statusColor = "#4B5563";
            } else if (state.action === 'prune') {
                lineColor = "#F87171"; lineWidth = 4; isDash = false;
                statusText = `✂️ Pruned! Bound (${state.currentCost.toFixed(1)}) >= Best (${state.bestCost.toFixed(1)})`;
                statusColor = "#DC2626";
            } else {
                lineColor = "#3B82F6"; lineWidth = 5; isDash = false;
                statusText = `🏆 Optimal Route Found! Cost: ${state.currentCost.toFixed(1)}`;
                statusColor = "#2563EB";
            }

            for (let i = 0; i < path.length - 1; i++) {
                const p1 = cities[path[i]];
                const p2 = cities[path[i+1]];
                
                let segColor = lineColor;
                let segWidth = lineWidth;
                
                if (state.action === 'prune' && i === path.length - 2) {
                    segColor = "#F87171"; segWidth = 5;
                }

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = segColor;
                ctx.lineWidth = segWidth;
                ctx.lineCap = 'round';
                ctx.setLineDash(isDash && (state.action !== 'prune' || i !== path.length - 2) ? [8, 8] : []);
                ctx.stroke();
            }
            ctx.setLineDash([]); 

            animStatus.textContent = `[${idx + 1}/${historyData.length}] ${statusText}`;
            animStatus.style.color = statusColor;
        }

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.textContent = "Pause";
                playBtn.style.backgroundColor = "#F59E0B";
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                if (currentFrame >= historyData.length - 1) currentFrame = 0;
                playNextFrame();
            } else {
                playBtn.textContent = "Replay Animation";
                playBtn.style.backgroundColor = "#10B981";
                prevBtn.disabled = false;
                nextBtn.disabled = false;
                clearTimeout(animTimer);
            }
        });

        function playNextFrame() {
            if (isPlaying && currentFrame < historyData.length - 1) {
                currentFrame++;
                drawFrame(currentFrame);
                const speed = speedSlider.value;
                animTimer = setTimeout(playNextFrame, speed);
            } else if (currentFrame >= historyData.length - 1) {
                isPlaying = false;
                playBtn.textContent = "Replay Animation";
                playBtn.style.backgroundColor = "#10B981";
                prevBtn.disabled = false;
                nextBtn.disabled = true;
            }
        }

        nextBtn.addEventListener('click', () => {
            if (currentFrame < historyData.length - 1) {
                currentFrame++;
                drawFrame(currentFrame);
                prevBtn.disabled = false;
            }
            if (currentFrame >= historyData.length - 1) nextBtn.disabled = true;
        });

        prevBtn.addEventListener('click', () => {
            if (currentFrame > 0) {
                currentFrame--;
                drawFrame(currentFrame);
                nextBtn.disabled = false;
            }
            if (currentFrame <= 0) prevBtn.disabled = true;
        });

    </script>
